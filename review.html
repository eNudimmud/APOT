<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>λP⊙T — responsive review</title><style>body{margin:0;background:#111c26;color:#e7e2d4;font:14px Arial,sans-serif}header{padding:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,a{font:inherit;color:inherit;background:transparent;border:1px solid #e7e2d450;padding:10px 14px;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#e7e2d4;color:#07121d}main{padding:10px 20px 30px;overflow:auto}iframe{display:block;width:390px;height:844px;margin:auto;border:1px solid #e7e2d450;background:#07121d}p{margin:0;color:#a9b6c0;font-size:12px}</style></head><body><header><strong>λP⊙T / REVIEW</strong><button type="button" data-width="390" aria-pressed="true">Mobile 390</button><button type="button" data-width="768" aria-pressed="false">Tablet 768</button><button type="button" data-width="1024" aria-pressed="false">Desktop 1024</button><a href="index.html">Open full page ↗</a><p>Layout viewport review. Device pixel ratio is inherited from your browser.</p></header><main><iframe src="index.html#top" title="λP⊙T responsive preview"></iframe></main><script>const frame=document.querySelector('iframe');document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{frame.style.width=button.dataset.width+'px';document.querySelectorAll('[data-width]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));}));</script></body></html>
